<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Short Zone</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial;overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

.app{max-width:600px;margin:auto;height:100vh;background:#000}

.top{
 position:fixed;top:0;left:0;right:0;height:58px;z-index:20;
 display:flex;align-items:center;padding:0 16px;
 background:rgba(0,0,0,.86);backdrop-filter:blur(8px)
}
.logo{font-size:21px;font-weight:800}

.page{display:none;height:100vh;overflow:auto;padding:58px 0 70px}
.page.active{display:block}

.feed{
 height:100vh;overflow-y:auto;padding-top:58px;padding-bottom:64px;
 scroll-snap-type:y mandatory
}

.vid{
 height:calc(100vh - 58px);
 position:relative;background:#000;
 scroll-snap-align:start;
 display:flex;align-items:center;justify-content:center
}

.vid video{
 width:100%;height:100%;object-fit:contain;background:#000
}

.info{
 position:absolute;left:14px;bottom:82px;max-width:72%;
 z-index:5;text-shadow:0 1px 5px #000;line-height:1.4
}

.actions{
 position:absolute;right:10px;bottom:82px;z-index:5;
 display:flex;flex-direction:column;align-items:center;gap:5px
}

.act{
 width:48px;height:48px;border:0;border-radius:50%;
 background:rgba(0,0,0,.4);color:#fff;font-size:28px
}

.act.liked{color:red}
.count{font-size:12px;margin-bottom:5px}

.verify{
 display:inline-flex;align-items:center;justify-content:center;
 width:17px;height:17px;border-radius:50%;
 background:#1683ff;color:#fff;font-size:10px;font-weight:bold;
 vertical-align:middle
}

.nav{
 position:fixed;bottom:0;left:0;right:0;height:64px;z-index:30;
 display:flex;justify-content:center;background:#0a0a0a;
 border-top:1px solid #222
}

.nav button{
 flex:1;max-width:120px;border:0;background:none;
 color:#aaa;font-size:24px
}

.nav small{display:block;font-size:10px}

.box{padding:18px}

input,textarea,select{
 width:100%;padding:13px;margin:7px 0;border-radius:10px;
 border:1px solid #333;background:#151515;color:#fff
}

textarea{min-height:100px}

.primary{
 width:100%;padding:13px;margin-top:8px;border:0;
 border-radius:10px;background:#1683ff;color:#fff;font-weight:bold
}

.secondary{
 padding:10px 14px;border:1px solid #444;
 border-radius:9px;background:#151515;color:#fff
}

.searchrow{display:flex;gap:7px;padding:12px}
.searchrow input{margin:0;flex:1}
.searchrow button{
 width:55px;border:0;border-radius:10px;
 background:#1683ff;color:#fff
}

.result{
 display:flex;align-items:center;gap:12px;padding:12px 16px;
 border-bottom:1px solid #222
}

.resulttext{flex:1}
.resulttext b{display:block}
.resulttext span{color:#aaa;font-size:13px}

.follow{
 border:0;border-radius:9px;background:#1683ff;
 color:#fff;padding:9px 14px;font-weight:bold
}

.avatar,.bigavatar{
 border-radius:50%;
 background:linear-gradient(135deg,#1683ff,#6b20ff);
 display:flex;align-items:center;justify-content:center;
 overflow:hidden;font-weight:900
}

.avatar{width:48px;height:48px;min-width:48px}
.bigavatar{width:105px;height:105px;margin:auto;font-size:40px}

.avatar img,.bigavatar img{
 width:100%;height:100%;object-fit:cover
}

.profileHead{text-align:center;padding:25px 18px}
.profileHead h2{margin:13px 0 5px}
.username{color:#aaa}
.bio{color:#ddd;max-width:430px;margin:13px auto}

.stats{
 display:flex;justify-content:center;gap:38px;margin:20px 0
}

.stats b{display:block;font-size:18px}
.stats span{color:#aaa;font-size:12px}

.profileVideos{
 display:grid;grid-template-columns:repeat(3,1fr);gap:2px
}

.profileVideos video{
 width:100%;aspect-ratio:9/14;
 object-fit:cover;background:#111
}

.comment{
 display:flex;gap:10px;padding:10px 0;
 border-bottom:1px solid #222
}

.comment .avatar{
 width:38px;height:38px;min-width:38px;font-size:13px
}

.commentmain{flex:1}
.commentmain p{margin:5px 0;color:#ddd}

.commentlike{
 border:0;background:none;color:#aaa
}

.commentlike.liked{color:red}

.message{
 max-width:80%;margin:7px;padding:10px 13px;
 border-radius:13px;background:#202020
}

.message.me{
 margin-left:auto;background:#1683ff
}

.modal{
 display:none;position:fixed;inset:0;z-index:100;
 background:rgba(0,0,0,.8);
 align-items:center;justify-content:center;padding:20px
}

.modal.show{display:flex}

.modalbox{
 width:100%;max-width:500px;max-height:90vh;
 overflow:auto;background:#111;border:1px solid #333;
 border-radius:15px;padding:18px
}
</style>
</head>

<body>

<div class="app">

<header class="top">
 <div class="logo">Short Zone</div>
</header>

<!-- BERANDA -->
<section id="home" class="page active">
 <div id="feed" class="feed"></div>
</section>

<!-- CARI -->
<section id="search" class="page">

 <div class="searchrow">
  <input id="searchInput" placeholder="Cari pengguna atau video...">
  <button onclick="searchAll()">⌕</button>
 </div>

 <div class="box">
  <select id="searchType">
   <option value="users">Cari pengguna</option>
   <option value="videos">Cari video</option>
  </select>
 </div>

 <div id="searchResults"></div>
</section>

<!-- BUAT -->
<section id="create" class="page">
 <div class="box">

  <h2>Buat Video</h2>

  <input id="videoFile" type="file" accept="video/*">

  <textarea id="caption"
   placeholder="Tulis caption..."></textarea>

  <button class="primary" onclick="uploadVideo()">
   Posting Video
  </button>

  <p id="uploadStatus"></p>

 </div>
</section>

<!-- CHAT -->
<section id="chat" class="page">

 <div class="box">

  <h2>Chat</h2>

  <input id="chatUser"
   placeholder="Username tujuan">

  <button class="primary" onclick="openChat()">
   Buka Chat
  </button>

 </div>

 <div id="chatArea"></div>

</section>

<!-- PROFIL -->
<section id="profile" class="page">
 <div id="profileContent"></div>
</section>

<!-- NAVIGASI -->
<nav class="nav">

 <button onclick="go('home')">
  ⌂<small>Beranda</small>
 </button>

 <button onclick="go('search')">
  ⌕<small>Cari</small>
 </button>

 <button onclick="go('create')">
  ＋<small>Buat</small>
 </button>

 <button onclick="go('chat')">
  ♡<small>Chat</small>
 </button>

 <button onclick="go('profile')">
  ◯<small>Profil</small>
 </button>

</nav>

</div>

<!-- EDIT PROFIL -->
<div id="editModal" class="modal">

 <div class="modalbox">

  <h2>Edit Profil</h2>

  <input id="editName"
   value="Short Zone" disabled>

  <input id="editUsername"
   value="shortzone" disabled>

  <textarea id="editBio"
   placeholder="Bio..."></textarea>

  <input id="editPhoto"
   type="file" accept="image/*">

  <button class="primary" onclick="saveProfile()">
   Simpan
  </button>

  <button class="secondary"
   style="width:100%;margin-top:8px"
   onclick="closeEdit()">
   Batal
  </button>

 </div>

</div>

<script>

/* =========================
   FIREBASE
========================= */

firebase.initializeApp({
 apiKey:"AIzaSyARSjlrsYyCOQhisDFFzBoankQwmSHI",
 authDomain:"shortzone-ec194.firebaseapp.com",
 projectId:"shortzone-ec194",
 storageBucket:"shortzone-ec194.firebasestorage.app",
 messagingSenderId:"9616384408",
 appId:"1:9616384408:web:f4589631c58a3a75d1cbed"
});

const db=firebase.firestore();

const USER="shortzone";

const CLOUDINARY_URL=
"https://api.cloudinary.com/v1_1/urmdpim/video/upload";

const UPLOAD_PRESET="shortzone";


/* =========================
   AKUN RESMI
========================= */

const OFFICIAL={
 username:"shortzone",
 displayName:"Short Zone",
 bio:"Akun resmi Short Zone.",
 official:true,
 photo:""
};

db.collection("users")
 .doc("shortzone")
 .set(OFFICIAL,{merge:true});


/* =========================
   UTILITAS
========================= */

function esc(v){
 if(v==null)return "";

 return String(v)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function badge(u){
 return String(u).toLowerCase()==="shortzone"
  ?'<span class="verify">✓</span>'
  :"";
}

function avatar(u,big=false){

 let c=big?"bigavatar":"avatar";

 if(u.photo){
  return `
   <div class="${c}">
    <img src="${esc(u.photo)}">
   </div>`;
 }

 let initial="U";

 if(String(u.username).toLowerCase()==="shortzone"){
  initial="SZ";
 }else if(u.displayName){
  initial=String(u.displayName)
   .substring(0,2).toUpperCase();
 }

 return `<div class="${c}">${esc(initial)}</div>`;
}

async function getUser(u){

 if(String(u).toLowerCase()==="shortzone")
  return OFFICIAL;

 let s=await db.collection("users").doc(u).get();

 if(s.exists)return s.data();

 return {
  username:u,
  displayName:u,
  bio:"",
  photo:"",
  official:false
 };
}


/* =========================
   PINDAH HALAMAN
========================= */

function go(p){

 document.querySelectorAll(".page")
  .forEach(x=>x.classList.remove("active"));

 document.getElementById(p)
  .classList.add("active");

 if(p==="home")loadFeed();

 if(p==="profile")
  loadProfile("shortzone");
}


/* =========================
   FEED
========================= */

async function loadFeed(){

 let feed=document.getElementById("feed");

 let snap=await db.collection("videos")
  .orderBy("createdAt","desc")
  .get();

 feed.innerHTML="";

 snap.forEach(doc=>{

  let x=doc.data();
  let likes=x.likes||[];
  let liked=false;

  for(let i=0;i<likes.length;i++){
   if(likes[i]===USER){
    liked=true;
    break;
   }
  }

  feed.innerHTML+=`

   <div class="vid"
    data-id="${esc(doc.id)}">

    <video
     src="${esc(x.url)}"
     loop
     playsinline
     controls
     preload="metadata">
    </video>

    <div class="info">

     <b>
      @${esc(x.username)}
      ${badge(x.username)}
     </b>

     <br>

     ${esc(x.caption||"")}

    </div>

    <div class="actions">

     <button
      class="act ${liked?"liked":""}"
      onclick="toggleLike('${esc(doc.id)}',this)">
      ${liked?"♥":"♡"}
     </button>

     <div class="count likecount">
      ${likes.length}
     </div>

     <button
      class="act"
      onclick="showComments('${esc(doc.id)}')">
      💬
     </button>

     <div class="count">
      ${x.commentCount||0}
     </div>

     <button
      class="act"
      onclick="openVideoProfile('${esc(x.username)}')">
      ◯
     </button>

    </div>

   </div>
  `;
 });

 setupVideoAutoplay();
}


/* =========================
   LIKE
   TIDAK RELOAD VIDEO
========================= */

async function toggleLike(id,button){

 let ref=db.collection("videos").doc(id);

 let snap=await ref.get();

 if(!snap.exists)return;

 let likes=(snap.data().likes||[]).slice();

 let pos=-1;

 for(let i=0;i<likes.length;i++){

  if(likes[i]===USER){
   pos=i;
   break;
  }

 }

 if(pos>=0){

  likes.splice(pos,1);

  button.classList.remove("liked");
  button.innerText="♡";

 }else{

  likes.push(USER);

  button.classList.add("liked");
  button.innerText="♥";
 }

 await ref.update({
  likes:likes
 });

 let count=button.parentElement
  .querySelector(".likecount");

 if(count)
  count.innerText=likes.length;
}


/* =========================
   AUTOPLAY
========================= */

function setupVideoAutoplay(){

 let vids=document.querySelectorAll(".vid video");

 let ob=new IntersectionObserver(entries=>{

  for(let i=0;i<entries.length;i++){

   let v=entries[i].target;

   if(entries[i].isIntersecting &&
      entries[i].intersectionRatio>.65){

    for(let j=0;j<vids.length;j++){

     if(vids[j]!==v)
      vids[j].pause();

    }

    v.play().catch(()=>{});

   }else{

    v.pause();

   }
  }

 },{
  threshold:[0,.65,1]
 });

 vids.forEach(v=>ob.observe(v));
}


/* =========================
   PROFIL
   SUKA | PENGIKUT | MENGIKUTI
========================= */

async function loadProfile(u){

 let x=await getUser(u);

 let videos=await db.collection("videos")
  .where("username","==",u)
  .get();

 let followers=await db.collection("follows")
  .where("following","==",u)
  .get();

 let following=await db.collection("follows")
  .where("follower","==",u)
  .get();


 /* TOTAL SEMUA LIKE */

 let totalLikes=0;

 videos.forEach(d=>{

  let data=d.data();

  totalLikes+=(data.likes||[]).length;

 });


 let official=
  String(u).toLowerCase()==="shortzone";


 document.getElementById("profileContent")
 .innerHTML=`

  <div class="profileHead">

   ${avatar(x,true)}

   <h2>

    ${esc(
     official
     ?"Short Zone"
     :(x.displayName||u)
    )}

    ${official
     ?'<span class="verify">✓</span>'
     :""}

   </h2>

   <div class="username">

    @${esc(
     official
     ?"shortzone"
     :(x.username||u)
    )}

    ${official
     ?'<span class="verify">✓</span>'
     :""}

   </div>

   ${
    official
    ?"<p><b>Akun resmi</b></p>"
    :""
   }

   <p class="bio">
    ${esc(x.bio||"")}
   </p>

   <div class="stats">

    <div>
     <b>${totalLikes}</b>
     <span>Suka</span>
    </div>

    <div>
     <b>${followers.size}</b>
     <span>Pengikut</span>
    </div>

    <div>
     <b>${following.size}</b>
     <span>Mengikuti</span>
    </div>

   </div>

   ${
    official

    ?'<button class="secondary" onclick="openEdit()">Edit Profil</button>'

    :'<button class="follow" onclick="toggleFollow(\''+
      esc(u)+
      '\')">+</button>'
   }

  </div>

  <div
   class="profileVideos"
   id="profileVideos">
  </div>
 `;


 let pv=document.getElementById("profileVideos");


 videos.forEach(d=>{

  let data=d.data();

  pv.innerHTML+=`

   <video
    src="${esc(data.url)}"
    controls
    playsinline
    preload="metadata">
   </video>

  `;

 });
}


/* =========================
   BUKA PROFIL DARI VIDEO
========================= */

function openVideoProfile(u){

 loadProfile(u);

 go("profile");
}


/* =========================
   EDIT PROFIL
========================= */

async function openEdit(){

 let x=await getUser("shortzone");

 document.getElementById("editBio")
  .value=x.bio||"";

 document.getElementById("editPhoto")
  .value="";

 document.getElementById("editModal")
  .classList.add("show");
}

function closeEdit(){

 document.getElementById("editModal")
  .classList.remove("show");
}


function readImage(file){

 return new Promise((resolve,reject)=>{

  let r=new FileReader();

  r.onload=()=>resolve(r.result);
  r.onerror=reject;

  r.readAsDataURL(file);
 });
}


async function saveProfile(){

 let bio=document.getElementById("editBio")
  .value.trim();

 let old=await getUser("shortzone");

 let photo=old.photo||"";

 let f=document.getElementById("editPhoto")
  .files[0];

 if(f)
  photo=await readImage(f);


 await db.collection("users")
  .doc("shortzone")
  .set({

   username:"shortzone",
   displayName:"Short Zone",
   bio:bio||"Akun resmi Short Zone.",
   official:true,
   photo:photo

  },{merge:true});


 closeEdit();

 loadProfile("shortzone");
}


/* =========================
   KOMENTAR
========================= */

async function showComments(id){

 let snap=await db.collection("videos")
  .doc(id)
  .collection("comments")
  .orderBy("createdAt","asc")
  .get();


 let html=`

  <div class="modal show"
   id="commentModal">

   <div class="modalbox">

    <h3>Komentar</h3>

    <div>
 `;


 snap.forEach(d=>{

  let x=d.data();
  let likes=x.likes||[];
  let liked=false;

  for(let i=0;i<likes.length;i++){

   if(likes[i]===USER){
    liked=true;
    break;
   }

  }


  html+=`

   <div class="comment">

    ${avatar({
     username:x.username,
     displayName:x.displayName,
     photo:x.photo
    })}

    <div class="commentmain">

     <b>
      @${esc(x.username)}
      ${badge(x.username)}
     </b>

     <p>
      ${esc(x.text||"")}
     </p>

     <button
      class="commentlike ${liked?"liked":""}"
      onclick="likeComment(
       '${esc(id)}',
       '${esc(d.id)}'
      )">

      ${liked?"♥":"♡"}
      ${likes.length}

     </button>

    </div>

   </div>
  `;
 });


 html+=`

    </div>

    <input
     id="commentInput"
     placeholder="Tulis komentar...">

    <button
     class="primary"
     onclick="sendComment('${esc(id)}')">
     Kirim
    </button>

    <button
     class="secondary"
     style="width:100%;margin-top:8px"
     onclick="closeComment()">
     Tutup
    </button>

   </div>
  </div>
 `;


 document.body.insertAdjacentHTML(
  "beforeend",
  html
 );
}


function closeComment(){

 let x=document.getElementById(
  "commentModal"
 );

 if(x)x.remove();
}


async function sendComment(id){

 let input=document.getElementById(
  "commentInput"
 );

 let text=input.value.trim();

 if(!text)return;

 let u=await getUser(USER);


 await db.collection("videos")
  .doc(id)
  .collection("comments")
  .add({

   username:"shortzone",
   displayName:"Short Zone",
   photo:u.photo||"",
   text:text,
   likes:[],
   createdAt:
    firebase.firestore.FieldValue
    .serverTimestamp()

  });


 let ref=db.collection("videos").doc(id);

 let s=await ref.get();

 await ref.update({

  commentCount:
   (s.data().commentCount||0)+1

 });


 closeComment();

 loadFeed();
}


async function likeComment(
 videoId,
 commentId
){

 let ref=db.collection("videos")
  .doc(videoId)
  .collection("comments")
  .doc(commentId);

 let s=await ref.get();

 if(!s.exists)return;

 let likes=s.data().likes||[];
 let pos=-1;

 for(let i=0;i<likes.length;i++){

  if(likes[i]===USER){
   pos=i;
   break;
  }

 }

 if(pos>=0)
  likes.splice(pos,1);
 else
  likes.push(USER);

 await ref.update({
  likes:likes
 });

 closeComment();

 showComments(videoId);
}


/* =========================
   FOLLOW
========================= */

async function toggleFollow(target){

 if(target===USER)return;

 let id=USER+"_"+target;

 let ref=db.collection("follows")
  .doc(id);

 let s=await ref.get();

 if(s.exists){

  await ref.delete();

 }else{

  await ref.set({

   follower:USER,
   following:target,

   createdAt:
    firebase.firestore.FieldValue
    .serverTimestamp()

  });

 }

 loadProfile(target);
}


/* =========================
   PENCARIAN
========================= */

async function searchAll(){

 let q=document.getElementById(
  "searchInput"
 ).value.trim().toLowerCase();

 let type=document.getElementById(
  "searchType"
 ).value;

 let box=document.getElementById(
  "searchResults"
 );

 if(!q){

  box.innerHTML="";
  return;

 }

 box.innerHTML="Mencari...";


 /* CARI USER */

 if(type==="users"){

  let snap=await db.collection(
   "users"
  ).get();

  box.innerHTML="";


  snap.forEach(d=>{

   let x=d.data();

   let name=
    (x.displayName||"").toLowerCase();

   let u=
    (x.username||"").toLowerCase();


   if(
    name.indexOf(q)>=0||
    u.indexOf(q)>=0
   ){

    box.innerHTML+=`

     <div class="result">

      ${avatar(x)}

      <div class="resulttext">

       <b>
        ${esc(x.displayName||x.username)}
        ${badge(x.username)}
       </b>

       <span>
        @${esc(x.username)}
       </span>

      </div>

      ${
       x.username!==USER

       ?`<button
          class="follow"
          onclick="toggleFollow('${esc(x.username)}')">
          +
         </button>`

       :""
      }

     </div>
    `;
   }

  });


 /* CARI VIDEO */

 }else{

  let snap=await db.collection(
   "videos"
  ).get();

  box.innerHTML="";


  snap.forEach(d=>{

   let x=d.data();

   let c=
    (x.caption||"").toLowerCase();

   let u=
    (x.username||"").toLowerCase();


   if(
    c.indexOf(q)>=0||
    u.indexOf(q)>=0
   ){

    box.innerHTML+=`

     <div style="padding:12px">

      <video
       src="${esc(x.url)}"
       controls
       playsinline
       preload="metadata"
       style="
        width:100%;
        max-height:500px;
        object-fit:contain;
        background:#000">
      </video>

      <p>
       <b>
        @${esc(x.username)}
        ${badge(x.username)}
       </b>
      </p>

      <p>
       ${esc(x.caption||"")}
      </p>

      <button
       class="secondary"
       onclick="showCo
