<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShortZone</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#000;
  color:white;
}

.page{
  min-height:100vh;
  display:none;
}

.active{
  display:block;
}

/* LOGIN */
#loginPage{
  min-height:100vh;
  background:linear-gradient(160deg,#071dff,#00aaff);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:400px;
  background:rgba(0,0,0,.85);
  border-radius:25px;
  padding:30px 22px;
  box-shadow:0 10px 40px rgba(0,0,0,.4);
}

.logo{
  text-align:center;
  font-size:36px;
  font-weight:900;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#bbb;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:15px;
  margin:7px 0;
  border:0;
  outline:none;
  border-radius:13px;
  background:#222;
  color:white;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:13px;
  background:#1683ff;
  color:white;
  font-size:16px;
  font-weight:bold;
}

button:active{
  transform:scale(.98);
}

.switch{
  text-align:center;
  margin-top:18px;
  color:#aaa;
}

.switch span{
  color:#3ca9ff;
  font-weight:bold;
}

.error{
  color:#ff5252;
  text-align:center;
  margin-top:12px;
  min-height:20px;
}

/* HOME */
#homePage{
  min-height:100vh;
  background:#050505;
  padding-bottom:80px;
}

.topbar{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:#080808;
  border-bottom:1px solid #222;
  position:sticky;
  top:0;
  z-index:10;
}

.brand{
  font-size:25px;
  font-weight:900;
}

.logout{
  width:auto;
  padding:9px 14px;
  margin:0;
  background:#222;
  font-size:13px;
}

.feed{
  max-width:600px;
  margin:auto;
}

.video-card{
  min-height:620px;
  border-bottom:1px solid #222;
  position:relative;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
}

.video-card video{
  width:100%;
  max-height:760px;
  object-fit:cover;
}

.video-info{
  position:absolute;
  bottom:20px;
  left:15px;
  right:15px;
  background:linear-gradient(transparent,rgba(0,0,0,.85));
  padding-top:80px;
}

.username{
  font-weight:bold;
  font-size:17px;
}

.verified{
  color:#1683ff;
  font-size:17px;
}

.empty{
  text-align:center;
  padding:80px 20px;
  color:#888;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:#090909;
  border-top:1px solid #222;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.nav{
  background:none;
  width:auto;
  margin:0;
  padding:8px 20px;
  font-size:13px;
}

.nav.active-nav{
  color:#1683ff;
}

.profile{
  max-width:600px;
  margin:auto;
  padding:35px 20px;
  text-align:center;
}

.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  background:#1683ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
  font-weight:bold;
  margin:auto auto 15px;
}

.stats{
  display:flex;
  justify-content:center;
  gap:35px;
  margin-top:25px;
}

.stat b{
  display:block;
  font-size:20px;
}

.stat small{
  color:#888;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="page active">
  <div class="login-box">

    <div class="logo">ShortZone</div>
    <div class="subtitle">Video pendek untuk semua</div>

    <div id="loginForm">
      <input id="loginUsername" type="text" placeholder="Username">
      <input id="loginPassword" type="password" placeholder="Password">

      <button onclick="login()">Masuk</button>

      <div class="switch">
        Belum punya akun?
        <span onclick="showRegister()">Daftar</span>
      </div>
    </div>

    <div id="registerForm" style="display:none">
      <input id="registerUsername" type="text" placeholder="Username">
      <input id="registerPassword" type="password" placeholder="Password">
      <input id="registerPassword2" type="password" placeholder="Ulangi password">

      <button onclick="register()">Buat Akun</button>

      <div class="switch">
        Sudah punya akun?
        <span onclick="showLogin()">Masuk</span>
      </div>
    </div>

    <div id="error" class="error"></div>

  </div>
</div>


<!-- HOME -->
<div id="homePage" class="page">

  <div class="topbar">
    <div class="brand">ShortZone</div>
    <button class="logout" onclick="logout()">Keluar</button>
  </div>

  <div id="feed" class="feed">
    <div class="empty">Memuat video...</div>
  </div>

  <div id="profilePage" style="display:none">
    <div class="profile">

      <div class="avatar" id="avatar">S</div>

      <h2 id="profileUsername">Username</h2>

      <div class="stats">
        <div class="stat">
          <b id="followers">0</b>
          <small>Pengikut</small>
        </div>

        <div class="stat">
          <b id="following">0</b>
          <small>Mengikuti</small>
        </div>

        <div class="stat">
          <b id="likes">0</b>
          <small>Suka</small>
        </div>
      </div>

    </div>
  </div>

  <div class="bottom">
    <button class="nav active-nav" onclick="showHome()">Beranda</button>
    <button class="nav" onclick="showProfile()">Profil</button>
  </div>

</div>


<script>
const firebaseConfig = {
  apiKey: "AIzaSyARSjlrsY4yCOQhisDFFzBoankQwmruSHI",
  authDomain: "shortzone-ec194.firebaseapp.com",
  projectId: "shortzone-ec194",
  storageBucket: "shortzone-ec194.firebasestorage.app",
  messagingSenderId: "9616384408",
  appId: "1:9616384408:web:f4589631c58a3a75d1cbed",
  measurementId: "G-26BVG3X4B8"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;


/* =========================
   LOGIN / REGISTER
========================= */

function showRegister(){
  document.getElementById("loginForm").style.display="none";
  document.getElementById("registerForm").style.display="block";
  document.getElementById("error").textContent="";
}

function showLogin(){
  document.getElementById("registerForm").style.display="none";
  document.getElementById("loginForm").style.display="block";
  document.getElementById("error").textContent="";
}


async function register(){

  const username =
    document.getElementById("registerUsername").value
    .trim()
    .toLowerCase();

  const password =
    document.getElementById("registerPassword").value;

  const password2 =
    document.getElementById("registerPassword2").value;

  const error = document.getElementById("error");

  error.textContent="";

  if(username.length < 3){
    error.textContent="Username minimal 3 karakter.";
    return;
  }

  if(!/^[a-zA-Z0-9_]+$/.test(username)){
    error.textContent="Username hanya boleh huruf, angka, dan _.";
    return;
  }

  if(password.length < 6){
    error.textContent="Password minimal 6 karakter.";
    return;
  }

  if(password !== password2){
    error.textContent="Password tidak sama.";
    return;
  }

  try{

    /* cek username */
    const usernameCheck = await db
      .collection("users")
      .where("username","==",username)
      .limit(1)
      .get();

    if(!usernameCheck.empty){
      error.textContent="Nama akun sudah digunakan.";
      return;
    }

    /*
      Firebase Email/Password membutuhkan email.
      Kita buat email internal berdasarkan username.
      User tetap login menggunakan username.
    */
    const internalEmail =
      username + "@shortzone.local";

    const result =
      await auth.createUserWithEmailAndPassword(
        internalEmail,
        password
      );

    await db.collection("users")
      .doc(result.user.uid)
      .set({
        username:username,
        followers:0,
        following:0,
        likes:0,
        verified:false,
        canUpload:true,
        canComment:true,
        canLike:true,
        canFollow:true,
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });

    error.textContent="Akun berhasil dibuat!";

  }catch(e){

    console.error(e);

    if(e.code === "auth/email-already-in-use"){
      error.textContent="Nama akun sudah digunakan.";
    }else{
      error.textContent="Gagal membuat akun: " + e.message;
    }
  }
}


async function login(){

  const username =
    document.getElementById("loginUsername").value
    .trim()
    .toLowerCase();

  const password =
    document.getElementById("loginPassword").value;

  const error =
    document.getElementById("error");

  error.textContent="";

  if(!username || !password){
    error.textContent="Masukkan username dan password.";
    return;
  }

  try{

    /*
      Cari username di Firestore
      untuk mendapatkan UID akun.
    */

    const result = await db
      .collection("users")
      .where("username","==",username)
      .limit(1)
      .get();

    if(result.empty){
      error.textContent="Username atau password salah.";
      return;
    }

    const userData = result.docs[0].data();

    /*
      Email internal yang sama dengan
      saat pendaftaran.
    */

    const internalEmail =
      username + "@shortzone.local";

    await auth.signInWithEmailAndPassword(
      internalEmail,
      password
    );

  }catch(e){

    console.error(e);

    error.textContent="Username atau password salah.";
  }
}


/* =========================
   AUTH STATE
========================= */

auth.onAuthStateChanged(async(user)=>{

  if(user){

    currentUser=user;

    document.getElementById("loginPage")
      .classList.remove("active");

    document.getElementById("homePage")
      .classList.add("active");

    loadFeed();
    loadProfile();

  }else{

    currentUser=null;

    document.getElementById("homePage")
      .classList.remove("active");

    document.getElementById("loginPage")
      .classList.add("active");
  }

});


/* =========================
   LOGOUT
========================= */

async function logout(){

  await auth.signOut();

}


/* =========================
   HOME
========================= */

function showHome(){

  document.getElementById("feed").style.display="block";
  document.getElementById("profilePage").style.display="none";

  document.querySelectorAll(".nav")
    .forEach(x=>x.classList.remove("active-nav"));

  document.querySelector(".nav")
    .classList.add("active-nav");

}


function showProfile(){

  document.getElementById("feed").style.display="none";
  document.getElementById("profilePage").style.display="block";

  document.querySelectorAll(".nav")
    .forEach(x=>x.classList.remove("active-nav"));

  document.querySelectorAll(".nav")[1]
    .classList.add("active-nav");

}


/* =========================
   PROFILE
========================= */

async function loadProfile(){

  if(!currentUser) return;

  try{

    const doc = await db
      .collection("users")
      .doc(currentUser.uid)
      .get();

    if(!doc.exists) return;

    const data=doc.data();

    const username=data.username || "User";

    document.getElementById("profileUsername")
      .textContent=username;

    document.getElementById("avatar")
      .textContent=username
      .charAt(0)
      .toUpperCase();

    document.getElementById("followers")
      .textContent=data.followers || 0;

    document.getElementById("following")
      .textContent=data.following || 0;

    document.getElementById("likes")
      .textContent=data.likes || 0;

  }catch(e){

    console.error(e);

  }

}


/* =========================
   VIDEO FEED
========================= */

async function loadFeed(){

  const feed=document.getElementById("feed");

  feed.innerHTML=
    '<div class="empty">Memuat video...</div>';

  try{

    const snapshot = await db
      .collection("videos")
      .orderBy("createdAt","desc")
      .limit(30)
      .get();

    if(snapshot.empty){

      feed.innerHTML=
        '<div class="empty">Belum ada video.</div>';

      return;
    }

    feed.innerHTML="";

    snapshot.forEach(doc=>{

      const data=doc.data();

      const card=document.createElement("div");

      card.className="video-card";

      const username =
        data.username || "User";

      const verified =
        data.verified === true
        ? '<span class="verified"> ✓</span>'
        : "";

      card.innerHTML=`

        <video
          src="${escapeHtml(data.videoUrl || "")}"
          controls
          playsinline
          preload="metadata">
        </video>

        <div class="video-info">
          <div class="username">
            @${escapeHtml(username)}
            ${verified}
          </div>
        </div>
      `;

      feed.appendChild(card);

    });

  }catch(e){

    console.error(e);

    feed.innerHTML=
      '<div class="empty">Gagal memuat video.</div>';

  }

}


/* =========================
   SECURITY HELPER
========================= */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
</script>

</body>
</html>
