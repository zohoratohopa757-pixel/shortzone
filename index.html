<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ShortZone</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}
button{border:0;cursor:pointer}

#loginPage{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#075cff,#00bfff);
  padding:20px;
}
.loginBox{
  width:100%;
  max-width:380px;
  padding:30px 22px;
  border-radius:25px;
  text-align:center;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(15px);
}
.logo{
  font-size:40px;
  font-weight:900;
  margin-bottom:8px;
}
.logo span{color:#19a7ff}
.sub{color:#ddd;margin-bottom:28px}

.googleBtn{
  width:100%;
  padding:15px;
  border-radius:14px;
  background:#fff;
  color:#222;
  font-weight:bold;
  font-size:16px;
}
#error{
  color:#ff7777;
  margin-top:15px;
  font-size:13px;
}

#mainPage{
  display:none;
  height:100vh;
  position:relative;
}

#feed{
  height:calc(100vh - 65px);
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  scrollbar-width:none;
}
#feed::-webkit-scrollbar{display:none}

.videoItem{
  height:calc(100vh - 65px);
  position:relative;
  scroll-snap-align:start;
  background:#111;
}
.videoItem video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.videoInfo{
  position:absolute;
  left:15px;
  right:90px;
  bottom:25px;
  z-index:3;
  text-shadow:0 2px 5px #000;
}
.username{
  font-size:17px;
  font-weight:bold;
  margin-bottom:8px;
}
.caption{font-size:14px}

.verified{
  display:inline-flex;
  width:18px;
  height:18px;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#168cff;
  font-size:11px;
  margin-left:4px;
}

.actions{
  position:absolute;
  right:12px;
  bottom:25px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
  z-index:5;
}
.actionBtn{
  background:none;
  color:#fff;
  font-size:29px;
  text-shadow:0 2px 5px #000;
}
.actionCount{
  font-size:12px;
  margin-top:-14px;
}
.liked{color:#ff285c}

.bottomNav{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:65px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  background:rgba(0,0,0,.95);
  border-top:1px solid #222;
  z-index:20;
}
.navBtn{
  background:none;
  color:#aaa;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}
.navBtn b{font-size:23px}
.navBtn.active{color:#fff}

#uploadPage,#profilePage{
  display:none;
  position:absolute;
  inset:0;
  z-index:30;
  background:#050505;
  overflow-y:auto;
  padding-bottom:80px;
}
.pageHeader{
  height:60px;
  display:flex;
  align-items:center;
  padding:0 18px;
  font-size:19px;
  font-weight:bold;
  border-bottom:1px solid #222;
}
.uploadBox{padding:22px}
.input{
  width:100%;
  padding:15px;
  margin-bottom:15px;
  border-radius:14px;
  border:1px solid #333;
  background:#151515;
  color:#fff;
}
.uploadBtn{
  width:100%;
  padding:15px;
  border-radius:14px;
  background:#168cff;
  color:#fff;
  font-size:16px;
  font-weight:bold;
}
.status{
  text-align:center;
  color:#aaa;
  margin-top:15px;
}

.profileTop{
  text-align:center;
  padding:30px 20px;
}
.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #168cff;
}
.profileName{
  font-size:21px;
  font-weight:bold;
  margin-top:12px;
}
.stats{
  display:flex;
  justify-content:center;
  gap:35px;
  margin-top:22px;
}
.stat{text-align:center}
.stat b{display:block;font-size:19px}
.stat span{font-size:12px;color:#999}
.logoutBtn{
  margin-top:25px;
  padding:12px 25px;
  border-radius:12px;
  background:#222;
  color:#fff;
}

#commentModal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.65);
  align-items:flex-end;
}
.commentBox{
  width:100%;
  max-height:75vh;
  background:#111;
  border-radius:22px 22px 0 0;
  padding:18px;
}
.commentHeader{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
  font-weight:bold;
}
.commentHeader button{
  background:none;
  color:#fff;
  font-size:18px;
}
#commentsList{
  max-height:50vh;
  overflow-y:auto;
}
.comment{
  padding:10px 0;
  border-bottom:1px solid #222;
  font-size:14px;
}
.commentInputRow{
  display:flex;
  gap:8px;
  margin-top:12px;
}
#commentInput{
  flex:1;
  padding:12px;
  border:0;
  outline:none;
  border-radius:12px;
  background:#222;
  color:#fff;
}
.sendComment{
  padding:0 15px;
  border-radius:12px;
  background:#168cff;
  color:#fff;
}
.empty{
  text-align:center;
  color:#777;
  padding:50px 20px;
}
</style>
</head>

<body>

<div id="loginPage">
  <div class="loginBox">
    <div class="logo">Short<span>Zone</span></div>
    <div class="sub">Video pendek untuk semua orang</div>

    <button class="googleBtn" onclick="loginGoogle()">
      🔵 Masuk dengan Google
    </button>

    <div id="error"></div>
  </div>
</div>

<div id="mainPage">

  <div id="feed">
    <div class="empty">Memuat ShortZone...</div>
  </div>

  <div id="uploadPage">
    <div class="pageHeader">Upload Video</div>

    <div class="uploadBox">

      <input
        id="videoFile"
        class="input"
        type="file"
        accept="video/*"
      >

      <input
        id="captionInput"
        class="input"
        type="text"
        maxlength="150"
        placeholder="Tulis caption..."
      >

      <button class="uploadBtn" onclick="uploadVideo()">
        🚀 Upload Video
      </button>

      <div id="uploadStatus" class="status"></div>

    </div>
  </div>

  <div id="profilePage">
    <div class="pageHeader">Profil</div>

    <div class="profileTop">

      <img id="profileAvatar" class="avatar">

      <div id="profileUsername" class="profileName">
        Memuat...
      </div>

      <div class="stats">
        <div class="stat">
          <b id="followersCount">0</b>
          <span>Pengikut</span>
        </div>

        <div class="stat">
          <b id="followingCount">0</b>
          <span>Mengikuti</span>
        </div>

        <div class="stat">
          <b id="likesCount">0</b>
          <span>Suka</span>
        </div>
      </div>

      <button class="logoutBtn" onclick="logout()">
        Keluar
      </button>

    </div>
  </div>

  <nav class="bottomNav">

    <button class="navBtn active" onclick="showHome()">
      <b>⌂</b>
      Beranda
    </button>

    <button class="navBtn" onclick="showUpload()">
      <b>＋</b>
      Upload
    </button>

    <button class="navBtn" onclick="showProfile()">
      <b>●</b>
      Profil
    </button>

  </nav>

</div>

<div id="commentModal">
  <div class="commentBox">

    <div class="commentHeader">
      <span>Komentar</span>
      <button onclick="closeComments()">✕</button>
    </div>

    <div id="commentsList"></div>

    <div class="commentInputRow">
      <input
        id="commentInput"
        placeholder="Tulis komentar..."
        maxlength="200"
      >
      <button class="sendComment" onclick="sendComment()">
        Kirim
      </button>
    </div>

  </div>
</div>

<script>

/* ================================
   FIREBASE CONFIG BARU
================================ */

const firebaseConfig = {
  apiKey: "AIzaSyARSjlrsY4yCOQhisDFFzBoankQwmruSHI",
  authDomain: "shortzone-ec194.firebaseapp.com",
  projectId: "shortzone-ec194",
  storageBucket: "shortzone-ec194.firebasestorage.app",
  messagingSenderId: "9616384408",
  appId: "1:9616384408:web:f4589631c58a3a75d1cbed",
  measurementId: "G-26BVG3X4B8"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();


/* ================================
   CLOUDINARY CONFIG BARU
================================ */

const CLOUD_NAME = "urmdpimx";
const UPLOAD_PRESET = "shortzone";


let currentUser = null;
let currentCommentVideo = null;


/* ================================
   AKUN RESMI
================================ */

const officialAccounts = [
  "c00boy_",
  "shortzone"
];

function isOfficial(username){

  if(!username) return false;

  return officialAccounts.includes(
    username.toLowerCase()
  );

}


/* ================================
   LOGIN GOOGLE
================================ */

async function loginGoogle(){

  const error =
    document.getElementById("error");

  error.textContent =
    "Membuka login Google...";

  try{

    const provider =
      new firebase.auth.GoogleAuthProvider();

    provider.setCustomParameters({
      prompt:"select_account"
    });

    await auth.signInWithPopup(provider);

  }catch(e){

    console.error(e);

    error.textContent =
      "Terjadi kesalahan: " + e.message;

  }

}


/* ================================
   LOGIN STATE
================================ */

auth.onAuthStateChanged(async user => {

  if(user){

    currentUser = user;

    await createUserIfNeeded();

    document.getElementById("loginPage")
      .style.display = "none";

    document.getElementById("mainPage")
      .style.display = "block";

    loadVideos();
    loadProfile();

  }else{

    currentUser = null;

    document.getElementById("loginPage")
      .style.display = "flex";

    document.getElementById("mainPage")
      .style.display = "none";

  }

});


/* ================================
   BUAT USER
================================ */

async function createUserIfNeeded(){

  const ref =
    db.collection("users")
      .doc(currentUser.uid);

  const snap =
    await ref.get();

  if(!snap.exists){

    const username =
      "user_" +
      Math.floor(
        100000 +
        Math.random() * 900000
      );

    await ref.set({

      uid:currentUser.uid,

      username:username,

      usernameLower:
        username.toLowerCase(),

      displayName:
        currentUser.displayName || "User",

      photoURL:
        currentUser.photoURL || "",

      followers:0,

      following:0,

      likes:0,

      verified:false,

      canUpload:true,

      canComment:true,

      canLike:true,

      canFollow:true,

      createdAt:
        firebase.firestore.FieldValue
        .serverTimestamp()

    });

  }

}


/* ================================
   DATA USER
================================ */

async function getMyUser(){

  if(!currentUser) return null;

  const snap =
    await db.collection("users")
      .doc(currentUser.uid)
      .get();

  return snap.exists
    ? snap.data()
    : null;

}


/* ================================
   LOAD VIDEO
================================ */

function loadVideos(){

  const feed =
    document.getElementById("feed");

  db.collection("videos")
    .orderBy("createdAt","desc")
    .onSnapshot(snapshot => {

      feed.innerHTML = "";

      if(snapshot.empty){

        feed.innerHTML = `
          <div class="empty">
            Belum ada video.<br>
            Jadilah orang pertama yang upload!
          </div>
        `;

        return;
      }

      snapshot.forEach(doc => {

        feed.appendChild(
          createVideoElement(
            doc.id,
            doc.data()
          )
        );

      });

    },error => {

      console.error(error);

      feed.innerHTML = `
        <div class="empty">
          Gagal memuat video.
        </div>
      `;

    });

}


/* ================================
   VIDEO ELEMENT
================================ */

function createVideoElement(id,data){

  const item =
    document.createElement("div");

  item.className = "videoItem";

  const username =
    data.username || "user";

  item.innerHTML = `

    <video
      src="${escapeHtml(data.videoUrl || "")}"
      loop
      playsinline
      preload="metadata"
      onclick="toggleVideo(this)"
    ></video>

    <div class="videoInfo">

      <div class="username">
        @${escapeHtml(username)}

        ${
          isOfficial(username)
          ? '<span class="verified">✓</span>'
          : ''
        }

      </div>

      <div class="caption">
        ${escapeHtml(data.caption || "")}
      </div>

    </div>

    <div class="actions">

      <button
        class="actionBtn"
        id="like-${id}"
        onclick="likeVideo('${id}')"
      >♡</button>

      <div
        class="actionCount"
        id="likes-${id}"
      >${data.likes || 0}</div>

      <button
        class="actionBtn"
        onclick="openComments('${id}')"
      >💬</button>

      <div
        class="actionCount"
        id="comments-${id}"
      >0</div>

    </div>
  `;

  loadLikeState(id);
  loadCommentCount(id);

  return item;

}


/* ================================
   PLAY VIDEO
================================ */

function toggleVideo(video){

  if(video.paused){

    document.querySelectorAll("video")
      .forEach(v => {

        if(v !== video)
          v.pause();

      });

    video.play().catch(()=>{});

  }else{

    video.pause();

  }

}


/* ================================
   LIKE
================================ */

async function likeVideo(videoId){

  if(!currentUser) return;

  const user =
    await getMyUser();

  if(user?.canLike === false){

    alert(
      "Fitur suka dinonaktifkan untuk akun ini."
    );

    return;

  }

  const likeRef =
    db.collection("videos")
      .doc(videoId)
      .collection("likes")
      .doc(currentUser.uid);

  const videoRef =
    db.collection("videos")
      .doc(videoId);

  const snap =
    await likeRef.get();

  if(snap.exists){

    await likeRef.delete();

    await videoRef.update({
      likes:
        firebase.firestore.FieldValue
        .increment(-1)
    });

  }else{

    await likeRef.set({

      uid:currentUser.uid,

      createdAt:
        firebase.firestore.FieldValue
        .serverTimestamp()

    });

    await videoRef.update({
      likes:
        firebase.firestore.FieldValue
        .increment(1)
    });

  }

  loadLikeState(videoId);

}


/* ================================
   LIKE STATE
================================ */

async function loadLikeState(videoId){

  if(!currentUser) return;

  const ref =
    db.collection("videos")
      .doc(videoId)
      .collection("likes")
      .doc(currentUser.uid);

  const snap =
    await ref.get();

  const button =
    document.getElementById(
      "like-" + videoId
    );

  if(!button) return;

  if(snap.exists){

    button.textContent = "♥";
    button.classList.add("liked");

  }else{

    button.textContent = "♡";
    button.classList.remove("liked");

  }

}


/* ================================
   KOMENTAR
================================ */

function openComments(videoId){

  currentCommentVideo = videoId;

  document.getElementById("commentModal")
    .style.display = "flex";

  loadComments(videoId);

}

function closeComments(){

  document.getElementById("commentModal")
    .style.display = "none";

  currentCommentVideo = null;

}

function loadComments(videoId){

  db.collection("videos")
    .doc(videoId)
    .collection("comments")
    .orderBy("createdAt","asc")
    .onSnapshot(snapshot => {

      const list =
        document.getElementById(
          "commentsList"
        );

      list.innerHTML = "";

      if(snapshot.empty){

        list.innerHTML = `
          <div class="empty">
            Belum ada komentar.
          </div>
        `;

        return;

      }

      snapshot.forEach(doc => {

        const data = doc.data();

        const div =
          document.createElement("div");

        div.className = "comment";

        div.innerHTML = `
          <b>
            @${escapeHtml(
              data.username || "user"
            )}
          </b>
          ${escapeHtml(data.text || "")}
        `;

        list.appendChild(div);

      });

    });

}


/* ================================
   KIRIM KOMENTAR
================================ */

async function sendComment(){

  if(
    !currentUser ||
    !currentCommentVideo
  ) return;

  const input =
    document.getElementById(
      "commentInput"
    );

  const text =
    input.value.trim();

  if(!text) return;

  const user =
    await getMyUser();

  if(user?.canComment === false){

    alert(
      "Fitur komentar dinonaktifkan untuk akun ini."
    );

    return;

  }

  await db.collection("videos")
    .doc(currentCommentVideo)
    .collection("comments")
    .add({

      uid:currentUser.uid,

      username:
        user?.username || "user",

      text:text,

      createdAt:
        firebase.firestore.FieldValue
        .serverTimestamp()

    });

  input.value = "";

}


/* ================================
   JUMLAH KOMENTAR
================================ */

function loadCommentCount(videoId){

  db.collection("videos")
    .doc(videoId)
    .collection("comments")
    .onSnapshot(snapshot => {

      const el =
        document.getElementById(
          "comments-" + videoId
        );

      if(el)
        el.textContent =
          snapshot.size;

    });

}


/* ================================
   UPLOAD CLOUDINARY
================================ */

async function uploadVideo(){

  if(!currentUser){

    alert("Silakan login terlebih dahulu.");
    return;

  }

  const user =
    await getMyUser();

  if(user?.canUpload === false){

    alert(
      "Fitur upload dinonaktifkan untuk akun ini."
    );

    return;

  }

  const file =
    document.getElementById(
      "videoFile"
    ).files[0];

  const caption =
    document.getElementById(
      "captionInput"
    ).value.trim();

  const status =
    document.getElementById(
      "uploadStatus"
    );

  if(!file){

    alert("Pilih video terlebih dahulu.");
    return;

  }

  if(!file.type.startsWith("video/")){

    alert("File harus berupa video.");
    return;

  }

  status.textContent =
    "Mengupload video...";

  try{

    const formData =
      new FormData();

    formData.append(
      "file",
      file
    );

    formData.append(
      "upload_preset",
      UPLOAD_PRESET
    );

    const response =
      await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`,
        {
          method:"POST",
          body:formData
        }
      );

    const result =
      await response.json();

    if(!response.ok){

      throw new Error(
        result.error?.message ||
        "Upload gagal"
      );

    }

    await db.collection("videos")
      .add({

        videoUrl:
          result.secure_url,

        publicId:
          result.public_id || "",

        uid:
          currentUser.uid,

        username:
          user?.username || "user",

        caption:
          caption,

        likes:0,

        createdAt:
          firebase.firestore.FieldValue
          .serverTimestamp()

      });

    document.getElementById("videoFile")
      .value = "";

    document.getElementById("captionInput")
      .value = "";

    status.textContent =
      "✅ Video berhasil diupload!";

  }catch(error){

    console.error(error);

    status.textContent =
      "❌ " + error.message;

  }

}


/* ================================
   PROFILE
================================ */

async function loadProfile(){

  const user =
    await getMyUser();

  if(!user) return;

  document.getElementById(
    "profileUsername"
  ).innerHTML =
    "@" +
    escapeHtml(
      user.username || "user"
    ) +
    (
      isOfficial(user.username)
      ? ' <span class="verified">✓</span>'
      : ''
    );

  document.getElementById(
    "profileAvatar"
  ).src =
    user.photoURL ||
    currentUser.photoURL ||
    "https://www.gravatar.com/avatar/?d=mp";

  document.getElementById(
    "followersCount"
  ).textContent =
    user.followers || 0;

  document.getElementById(
    "followingCount"
