<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ShortZone</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  color:white;
  font-family:Arial,sans-serif;
}
button{
  border:0;
  cursor:pointer;
}
.hidden{display:none!important}

/* LOGIN */
#loginPage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px;
  background:linear-gradient(160deg,#050505,#08234a);
}
.loginBox{
  width:100%;
  max-width:380px;
  text-align:center;
}
.logo{
  width:90px;
  height:90px;
  margin:auto;
  border-radius:25px;
  background:#1677ff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:34px;
  font-weight:bold;
}
.loginBox h1{
  font-size:34px;
  margin:18px 0 8px;
}
.loginBox p{
  color:#aaa;
}
.googleBtn{
  width:100%;
  padding:16px;
  margin-top:25px;
  border-radius:14px;
  background:white;
  color:#111;
  font-size:16px;
  font-weight:bold;
}

/* APP */
#app{
  min-height:100vh;
  background:#000;
}
.page{
  min-height:calc(100vh - 65px);
}

/* FEED */
.feed{
  height:calc(100vh - 65px);
  overflow-y:auto;
  scroll-snap-type:y mandatory;
}
.videoCard{
  position:relative;
  height:calc(100vh - 65px);
  scroll-snap-align:start;
  background:#111;
}
.videoCard video{
  width:100%;
  height:100%;
  object-fit:cover;
}
.videoInfo{
  position:absolute;
  left:15px;
  right:80px;
  bottom:25px;
  text-shadow:0 2px 8px #000;
}
.videoInfo b{
  font-size:18px;
}
.videoInfo p{
  margin-top:8px;
}
.verified{
  color:#1683ff;
}
.actions{
  position:absolute;
  right:12px;
  bottom:30px;
  display:flex;
  flex-direction:column;
  gap:15px;
}
.actionBtn{
  width:52px;
  height:52px;
  border-radius:50%;
  background:#0009;
  color:#fff;
  font-size:22px;
}
.actionBtn small{
  display:block;
  font-size:10px;
}

/* NAV */
.bottomNav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:65px;
  background:#090909;
  border-top:1px solid #222;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}
.navBtn{
  background:none;
  color:#888;
  font-size:12px;
}
.navBtn span{
  display:block;
  font-size:23px;
}
.navBtn.active{
  color:white;
}

/* PROFILE */
.profile{
  padding:25px 18px 90px;
}
.profileHead{
  text-align:center;
}
.avatar{
  width:90px;
  height:90px;
  margin:auto;
  border-radius:50%;
  background:#1677ff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:35px;
  font-weight:bold;
}
.profileName{
  margin-top:12px;
  font-size:21px;
  font-weight:bold;
}
.stats{
  display:flex;
  justify-content:center;
  gap:35px;
  margin:22px 0;
}
.stat{
  text-align:center;
}
.stat b{
  display:block;
  font-size:20px;
}
.stat span{
  color:#888;
  font-size:12px;
}
.logout{
  width:100%;
  padding:14px;
  margin-top:25px;
  border-radius:10px;
  background:#b00020;
  color:white;
}

/* UPLOAD */
.uploadBox{
  padding:25px 18px 100px;
}
.uploadBox h2{
  margin-top:0;
}
input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #333;
  background:#151515;
  color:white;
}
.primary{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:10px;
  background:#1677ff;
  color:white;
  font-weight:bold;
}
.status{
  color:#aaa;
  text-align:center;
}
.empty{
  text-align:center;
  padding:100px 20px;
  color:#888;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">

  <div class="loginBox">

    <div class="logo">SZ</div>

    <h1>ShortZone</h1>

    <p>
      Nonton dan bagikan video pendek.
    </p>

    <button
      class="googleBtn"
      onclick="loginGoogle()">

      🔵 Masuk dengan Google

    </button>

    <p id="loginError"></p>

  </div>

</div>


<!-- APP -->
<div id="app" class="hidden">

  <!-- BERANDA -->
  <section id="feedPage" class="page">

    <div id="feed" class="feed">

      <div class="empty">
        Memuat video...
      </div>

    </div>

  </section>


  <!-- PROFIL -->
  <section
    id="profilePage"
    class="page hidden">

    <div class="profile">

      <div id="profileContent"></div>

    </div>

  </section>


  <!-- UPLOAD -->
  <section
    id="uploadPage"
    class="page hidden">

    <div class="uploadBox">

      <h2>Upload Video</h2>

      <input
        id="videoTitle"
        type="text"
        placeholder="Judul video">

      <input
        id="videoFile"
        type="file"
        accept="video/*">

      <button
        class="primary"
        onclick="uploadVideo()">

        Upload ke ShortZone

      </button>

      <p
        id="uploadStatus"
        class="status">
      </p>

    </div>

  </section>


  <!-- NAVIGASI -->
  <nav class="bottomNav">

    <button
      class="navBtn active"
      onclick="showPage('feed')">

      <span>⌂</span>
      Beranda

    </button>

    <button
      class="navBtn"
      onclick="showPage('upload')">

      <span>＋</span>
      Upload

    </button>

    <button
      class="navBtn"
      onclick="showPage('profile')">

      <span>♙</span>
      Profil

    </button>

  </nav>

</div>


<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyARSjlrsY4yCOQhisDFFzBoankQwmruSHI",

  authDomain:
  "shortzone-ec194.firebaseapp.com",

  projectId:
  "shortzone-ec194",

  storageBucket:
  "shortzone-ec194.firebasestorage.app",

  messagingSenderId:
  "9616384408",

  appId:
  "1:9616384408:web:f4589631c58a3a75d1cbed",

  measurementId:
  "G-26BVG3X4B8"
};

firebase.initializeApp(firebaseConfig);

const auth =
firebase.auth();

const db =
firebase.firestore();


/* =========================
   CLOUDINARY
========================= */

const CLOUD_NAME =
"urmdpimx";

const UPLOAD_PRESET =
"shortzone";


let currentUser = null;


/* =========================
   GOOGLE LOGIN
========================= */

async function loginGoogle(){

  const error =
  document.getElementById("loginError");

  error.textContent =
  "Membuka login Google...";

  try{

    const provider =
    new firebase.auth.GoogleAuthProvider();

    provider.setCustomParameters({
      prompt:"select_account"
    });

    await auth.signInWithPopup(provider);

  }

  catch(e){

    console.error(e);

    error.textContent =
    "Terjadi kesalahan: " +
    e.message;

  }

}


/* =========================
   LOGIN STATE
========================= */

auth.onAuthStateChanged(
async function(user){

  if(user){

    currentUser =
    user;

    document
    .getElementById("loginPage")
    .classList.add("hidden");

    document
    .getElementById("app")
    .classList.remove("hidden");

    await createUser();

    loadFeed();

    loadProfile();

  }

  else{

    currentUser =
    null;

    document
    .getElementById("loginPage")
    .classList.remove("hidden");

    document
    .getElementById("app")
    .classList.add("hidden");

  }

});


/* =========================
   USER
========================= */

async function createUser(){

  const ref =
  db.collection("users")
  .doc(currentUser.uid);

  const snap =
  await ref.get();

  if(!snap.exists){

    const username =
    "user_" +
    Math.random()
    .toString(36)
    .substring(2,8);

    await ref.set({

      uid:
      currentUser.uid,

      username:
      username,

      displayName:
      currentUser.displayName ||
      username,

      email:
      currentUser.email ||
      "",

      photoURL:
      currentUser.photoURL ||
      "",

      followers:0,

      following:0,

      likes:0,

      verified:false,

      canUpload:true,

      canComment:true,

      canLike:true,

      canFollow:true,

      createdAt:
      firebase.firestore
      .FieldValue
      .serverTimestamp()

    });

  }

}


/* =========================
   FEED
========================= */

function loadFeed(){

  db.collection("videos")
  .onSnapshot(

    function(snapshot){

      const videos = [];

      snapshot.forEach(
      function(doc){

        videos.push({

          id:doc.id,

          ...doc.data()

        });

      });


      videos.sort(
      function(a,b){

        const A =
        a.createdAt ?
        a.createdAt.toMillis() :
        0;

        const B =
        b.createdAt ?
        b.createdAt.toMillis() :
        0;

        return B-A;

      });


      renderFeed(videos);

    },

    function(error){

      console.error(error);

      document
      .getElementById("feed")
      .innerHTML =
      '<div class="empty">Gagal memuat video.</div>';

    }

  );

}


/* =========================
   RENDER VIDEO
========================= */

function renderFeed(videos){

  const feed =
  document.getElementById("feed");

  if(videos.length === 0){

    feed.innerHTML =
    '<div class="empty">Belum ada video.</div>';

    return;

  }


  feed.innerHTML = "";


  videos.forEach(
  function(video){

    const card =
    document.createElement("div");

    card.className =
    "videoCard";


    const username =
    escapeHtml(
      video.username ||
      "user"
    );

    const title =
    escapeHtml(
      video.title ||
      ""
    );

    const url =
    escapeHtml(
      video.url ||
      ""
    );


    card.innerHTML = `

      <video
        src="${url}"
        controls
        playsinline
        loop>
      </video>

      <div class="videoInfo">

        <b>
          @${username}

          ${
            video.verified
            ? '<span class="verified">✓</span>'
            : ''
          }

        </b>

        <p>
          ${title}
        </p>

      </div>


      <div class="actions">

        <button
          class="actionBtn"
          onclick="likeVideo('${video.id}')">

          ❤️

          <small>
            ${video.likes || 0}
          </small>

        </button>


        <button
          class="actionBtn"
          onclick="commentVideo('${video.id}')">

          💬

          <small>
            ${video.comments || 0}
          </small>

        </button>

      </div>

    `;


    feed.appendChild(card);

  });

}


/* =========================
   LIKE
========================= */

async function likeVideo(videoId){

  if(!currentUser)
  return;


  try{

    const ref =
    db.collection("videos")
    .doc(videoId);


    await db.runTransaction(
    async function(transaction){

      const snap =
      await transaction.get(ref);

      if(!snap.exists)
      return;


      const data =
      snap.data();

      const likedBy =
      data.likedBy || [];


      if(
        likedBy.includes(
          currentUser.uid
        )
      )
      return;


      transaction.update(
        ref,
        {

          likes:
          (data.likes || 0) + 1,

          likedBy:
          [
            ...likedBy,
            currentUser.uid
          ]

        }
      );

    });

  }

  catch(e){

    console.error(e);

  }

}


/* =========================
   COMMENT
========================= */

async function commentVideo(videoId){

  if(!currentUser)
  return;


  const text =
  prompt("Tulis komentar:");


  if(!text || !text.trim())
  return;


  try{

    await db
    .collection("videos")
    .doc(videoId)
    .collection("comments")
    .add({

      uid:
      currentUser.uid,

      username:
      currentUser.displayName ||
      "user",

      text:
      text.trim(),

      createdAt:
      firebase.firestore
      .FieldValue
      .serverTimestamp()

    });


    await db
    .collection("videos")
    .doc(videoId)
    .update({

      comments:
      firebase.firestore
      .FieldValue
      .increment(1)

    });

  }

  catch(e){

    alert(
      "Gagal mengirim komentar."
    );

  }

}


/* =========================
   UPLOAD
========================= */

async function uploadVideo(){

  if(!currentUser)
  return;


  const file =
  document
  .getElementById("videoFile")
  .files[0];


  const title =
  document
  .getElementById("videoTitle")
  .value
  .trim();


  const status =
  document
  .getElementById("uploadStatus");


  if(!file){

    status.textContent =
    "Pilih video terlebih dahulu.";

    return;

  }


  status.textContent =
  "Mengupload video...";


  try{

    const formData =
    new FormData();


    formData.append(
      "file",
      file
    );


    formData.append(
      "upload_preset",
      UPLOAD_PRESET
    );


    const response =
    await fetch(

      `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`,

      {

        method:"POST",

        body:formData

      }

    );


    const data =
    await response.json();


    if(!data.secure_url){

      throw new Error(
        data.error?.message ||
        "Upload Cloudinary gagal."
      );

    }


    const userSnap =
    await db
    .collection("users")
    .doc(currentUser.uid)
    .get();


    const userData =
    userSnap.exists
    ? userSnap.data()
    : {};


    await db
    .collection("videos")
    .add({

      uid:
      currentUser.uid,

      username:
      userData.username ||
      "user",

      displayName:
      userData.displayName ||
      currentUser.displayName ||
      "user",

      verified:
      userData.verified ||
      false,

      title:
      title,

      url:
      data.secure_url,

      publicId:
      data.public_id ||
      "",

      likes:0,

      comments:0,

      likedBy:[],

      createdAt:
      firebase.firestore
      .FieldValue
      .serverTimestamp()

    });


    document
    .getElementById("videoFile")
    .value = "";


    document
    .getElementById("videoTitle")
    .value = "";


    status.textContent =
    "Video berhasil diupload!";


    showPage("feed");

  }

  catch(e){

    console.error(e);

    status.textContent =
    "Upload gagal: " +
    e.message;

  }

}


/* =========================
   PROFILE
========================= */

async function loadProfile(){

  if(!currentUser)
  return;


  const snap =
  await db
  .collection("users")
  .doc(currentUser.uid)
  .get();


  if(!snap.exists)
  return;


  const data =
  snap.data();


  const name =
  escapeHtml(
    data.displayName ||
    data.username ||
    "User"
  );


  const username =
  escapeHtml(
    data.username ||
    "user"
  );


  const first =
  name.charAt(0)
  .toUpperCase();


  document
  .getElementById("profileContent")
  .innerHTML = `

    <div class="profileHead">

      <div class="avatar">
        ${first}
      </div>

      <div class="profileName">

        ${name}

        ${
          data.verified
          ? '<span class="verified">✓</span>'
          : ''
        }

      </div>

      <div style="color:#888">
        @${username}
      </div>


      <div class="stats">

        <div class="stat">

          <b>
            ${data.followers || 0}
          </b>

          <span>
            Pengikut
          </span>

        </div>


        <div class="stat">

          <b>
            ${data.following || 0}
          </b>

          <span>
            Mengikuti
          </span>

        </div>


        <div class="stat">

          <b>
            ${data.likes || 0}
          </b>

          <span>
            Suka
          </span>

        </div>

      </div>


      <button
        class="logout"
        onclick="logout()">

        Keluar

      </button>

    </div>

  `;

}


/* =========================
   NAVIGATION
========================= */

function showPage(page){

  document
  .getElementById("feedPage")
  .classList.add("hidden");

  document
  .getElementById("profilePage")
  .classList.add("hidden");

  document
  .getElementById("uploadPage")
  .classList.add("hidden");


  document
  .querySelectorAll(".navBtn")
  .forEach(
    function(btn){
      btn.classList.remove("active");
    }
  );


  if(page === "feed"){

    document
    .getElementById("feedPage")
    .classList.remove("hidden");

    document
    .querySelectorAll(".navBtn")[0]
    .classList.add("active");

  }


  if(page === "upload"){

    document
    .getElementById("uploadPage")
    .classList.remove("hidden");

    document
    .querySelectorAll(".navBtn")[1]
    .classList.add("active");

  }


  if(page === "profile"){

    document
    .getElementById("profilePage")
    .classList.remove("hidden");

    document
    .querySelectorAll(".navBtn")[2]
    .classList.add("active");

    loadProfile();

  }

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await auth.signOut();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value || "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
