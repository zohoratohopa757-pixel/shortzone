<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ShortZone</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  font-family:Arial,sans-serif;
  color:white;
}

body{
  overflow:hidden;
}

button,input{
  font-family:inherit;
}

button{
  border:0;
  cursor:pointer;
}

#app{
  width:100%;
  height:100vh;
  max-width:520px;
  margin:auto;
  background:#111;
  position:relative;
  overflow:hidden;
}

/* LOGIN */

#loginScreen{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:linear-gradient(145deg,#071d45,#0877ff);
}

.loginBox{
  width:100%;
  max-width:390px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
  backdrop-filter:blur(20px);
  border-radius:25px;
  padding:30px 22px;
  text-align:center;
}

.logo{
  font-size:42px;
  font-weight:900;
  margin-bottom:8px;
}

.logo span{
  color:#36a9ff;
}

.subtitle{
  color:#d9e8ff;
  margin-bottom:28px;
}

.googleBtn{
  width:100%;
  background:white;
  color:#222;
  padding:15px;
  border-radius:14px;
  font-size:16px;
  font-weight:bold;
}

.googleBtn:active{
  transform:scale(.98);
}

#error{
  color:#ffb4b4;
  font-size:13px;
  margin-top:15px;
  line-height:1.4;
}

/* MAIN */

#mainScreen{
  display:none;
  width:100%;
  height:100%;
  position:relative;
}

.topBar{
  position:absolute;
  z-index:20;
  top:0;
  left:0;
  width:100%;
  padding:15px;
  display:flex;
  justify-content:center;
  pointer-events:none;
}

.topLogo{
  font-size:23px;
  font-weight:900;
  text-shadow:0 2px 8px #000;
}

.topLogo span{
  color:#38a9ff;
}

#feed{
  width:100%;
  height:100%;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  scrollbar-width:none;
}

#feed::-webkit-scrollbar{
  display:none;
}

.videoCard{
  width:100%;
  height:100vh;
  position:relative;
  scroll-snap-align:start;
  background:#050505;
  overflow:hidden;
}

.video{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

.videoInfo{
  position:absolute;
  left:15px;
  right:75px;
  bottom:80px;
  z-index:5;
  text-shadow:0 2px 7px #000;
}

.username{
  font-weight:bold;
  font-size:17px;
  margin-bottom:8px;
}

.verified{
  display:inline-flex;
  width:18px;
  height:18px;
  align-items:center;
  justify-content:center;
  background:#168cff;
  color:white;
  border-radius:50%;
  font-size:12px;
  margin-left:4px;
}

.caption{
  font-size:15px;
  line-height:1.4;
}

.sideActions{
  position:absolute;
  right:12px;
  bottom:85px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
  z-index:10;
}

.action{
  background:rgba(0,0,0,.35);
  color:white;
  width:48px;
  height:48px;
  border-radius:50%;
  font-size:22px;
}

.actionCount{
  font-size:12px;
  margin-top:-14px;
}

/* NAV */

.bottomNav{
  position:absolute;
  z-index:30;
  bottom:0;
  left:0;
  width:100%;
  height:65px;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(12px);
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.navBtn{
  background:none;
  color:#aaa;
  font-size:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

.navBtn.active{
  color:white;
}

.navIcon{
  font-size:22px;
}

/* UPLOAD */

#uploadPanel,
#profilePanel{
  display:none;
  position:absolute;
  z-index:50;
  inset:0;
  background:#101010;
  overflow-y:auto;
  padding:20px;
  padding-bottom:90px;
}

.panelTitle{
  font-size:25px;
  font-weight:bold;
  margin:10px 0 25px;
}

.closeBtn{
  position:absolute;
  right:18px;
  top:15px;
  width:40px;
  height:40px;
  border-radius:50%;
  background:#292929;
  color:white;
  font-size:22px;
}

.fileBox{
  border:2px dashed #444;
  border-radius:20px;
  padding:30px 15px;
  text-align:center;
  margin-bottom:20px;
}

.fileBox input{
  width:100%;
  color:white;
}

.textInput{
  width:100%;
  background:#202020;
  color:white;
  border:1px solid #333;
  border-radius:12px;
  padding:14px;
  margin-bottom:15px;
  outline:none;
}

.primaryBtn{
  width:100%;
  padding:15px;
  border-radius:14px;
  background:#168cff;
  color:white;
  font-weight:bold;
  font-size:16px;
}

.primaryBtn:disabled{
  opacity:.5;
}

.progress{
  margin-top:15px;
  text-align:center;
  color:#aaa;
  font-size:14px;
}

/* PROFILE */

.profileHeader{
  text-align:center;
  padding-top:35px;
}

.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  background:linear-gradient(135deg,#168cff,#7a42ff);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  font-size:35px;
  font-weight:bold;
}

.profileName{
  font-size:21px;
  font-weight:bold;
  margin-top:12px;
}

.stats{
  display:flex;
  justify-content:center;
  gap:35px;
  margin:25px 0;
}

.stat{
  text-align:center;
}

.stat b{
  display:block;
  font-size:19px;
}

.stat span{
  color:#999;
  font-size:12px;
}

.profileButtons{
  display:flex;
  gap:10px;
}

.profileButtons button{
  flex:1;
  padding:12px;
  border-radius:10px;
  background:#292929;
  color:white;
}

.logout{
  margin-top:15px;
  width:100%;
  padding:13px;
  border-radius:10px;
  background:#c62828;
  color:white;
}

/* COMMENTS */

#commentBox{
  display:none;
  position:absolute;
  z-index:100;
  bottom:0;
  left:0;
  width:100%;
  background:#181818;
  border-radius:20px 20px 0 0;
  padding:18px;
  max-height:60%;
}

.commentTitle{
  font-size:18px;
  font-weight:bold;
  margin-bottom:15px;
}

.comments{
  max-height:220px;
  overflow-y:auto;
}

.comment{
  padding:10px 0;
  border-bottom:1px solid #292929;
}

.commentUser{
  font-weight:bold;
  font-size:13px;
}

.commentText{
  font-size:14px;
  margin-top:3px;
}

.commentForm{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.commentForm input{
  flex:1;
  background:#292929;
  border:0;
  border-radius:10px;
  padding:12px;
  color:white;
}

.commentForm button{
  width:50px;
  border-radius:10px;
  background:#168cff;
  color:white;
}

/* LOADING */

#loading{
  position:absolute;
  z-index:200;
  inset:0;
  background:#050505;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

.spinner{
  width:42px;
  height:42px;
  border:4px solid #333;
  border-top-color:#168cff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.loadingText{
  margin-top:15px;
  color:#aaa;
}

/* EMPTY */

.empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#888;
  text-align:center;
  padding:30px;
}
</style>
</head>

<body>

<div id="app">

  <div id="loading">
    <div class="spinner"></div>
    <div class="loadingText">Memuat ShortZone...</div>
  </div>

  <!-- LOGIN -->

  <div id="loginScreen">

    <div class="loginBox">

      <div class="logo">
        Short<span>Zone</span>
      </div>

      <div class="subtitle">
        Video pendek untuk semua orang
      </div>

      <button class="googleBtn" onclick="loginGoogle()">
        🔵 Masuk dengan Google
      </button>

      <div id="error"></div>

    </div>

  </div>

  <!-- MAIN -->

  <div id="mainScreen">

    <div class="topBar">
      <div class="topLogo">
        Short<span>Zone</span>
      </div>
    </div>

    <div id="feed">
      <div class="empty">
        Belum ada video.<br>
        Upload video pertama kamu!
      </div>
    </div>

    <!-- BOTTOM NAV -->

    <div class="bottomNav">

      <button class="navBtn active" onclick="showHome()">
        <div class="navIcon">🏠</div>
        Beranda
      </button>

      <button class="navBtn" onclick="openUpload()">
        <div class="navIcon">➕</div>
        Upload
      </button>

      <button class="navBtn" onclick="openProfile()">
        <div class="navIcon">👤</div>
        Profil
      </button>

    </div>

  </div>

  <!-- UPLOAD -->

  <div id="uploadPanel">

    <button class="closeBtn" onclick="closePanels()">×</button>

    <div class="panelTitle">
      Upload Video
    </div>

    <div class="fileBox">
      <div style="font-size:40px;margin-bottom:10px">🎬</div>
      <div style="margin-bottom:15px;color:#aaa">
        Pilih video dari HP kamu
      </div>

      <input
        type="file"
        id="videoFile"
        accept="video/*"
      >
    </div>

    <input
      id="caption"
      class="textInput"
      placeholder="Tulis caption..."
      maxlength="150"
    >

    <button
      id="uploadBtn"
      class="primaryBtn"
      onclick="uploadVideo()"
    >
      Upload Video
    </button>

    <div id="uploadProgress" class="progress"></div>

  </div>

  <!-- PROFILE -->

  <div id="profilePanel">

    <button class="closeBtn" onclick="closePanels()">×</button>

    <div class="profileHeader">

      <div class="avatar" id="avatar">
        S
      </div>

      <div class="profileName" id="profileName">
        Pengguna
      </div>

      <div id="profileEmail" style="color:#888;font-size:13px;margin-top:5px">
      </div>

      <div class="stats">

        <div class="stat">
          <b id="followers">0</b>
          <span>Pengikut</span>
        </div>

        <div class="stat">
          <b id="following">0</b>
          <span>Mengikuti</span>
        </div>

        <div class="stat">
          <b id="likes">0</b>
          <span>Suka</span>
        </div>

      </div>

      <div class="profileButtons">
        <button onclick="editUsername()">
          ✏️ Edit Nama
        </button>
      </div>

      <button class="logout" onclick="logout()">
        Keluar
      </button>

    </div>

  </div>

  <!-- COMMENTS -->

  <div id="commentBox">

    <div class="commentTitle">
      Komentar
      <button
        onclick="closeComments()"
        style="float:right;background:none;color:white;font-size:20px"
      >
        ×
      </button>
    </div>

    <div id="comments" class="comments"></div>

    <div class="commentForm">

      <input
        id="commentInput"
        placeholder="Tulis komentar..."
        maxlength="200"
      >

      <button onclick="sendComment()">
        ➤
      </button>

    </div>

  </div>

</div>

<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyARSjlrsY4yMCQhisDFFzBoankQwmruSHI",
  authDomain: "shortzone-ec194.firebaseapp.com",
  projectId: "shortzone-ec194",
  storageBucket: "shortzone-ec194.firebasestorage.app",
  messagingSenderId: "9616384408",
  appId: "1:9616384408:web:f4589631c58a3a75d1cbed",
  measurementId: "G-26BVG3X4B8"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* =========================
   CLOUDINARY
========================= */

const CLOUD_NAME = "urmdpimx";
const UPLOAD_PRESET = "shortzone";

/* =========================
   VARIABLES
========================= */

let currentUser = null;
let currentVideoId = null;
let currentUsername = "Pengguna";

/* =========================
   GOOGLE LOGIN
========================= */

async function loginGoogle(){

  const error =
    document.getElementById("error");

  error.textContent =
    "Membuka login Google...";

  try{

    const provider =
      new firebase.auth.GoogleAuthProvider();

    provider.setCustomParameters({
      prompt:"select_account"
    });

    await auth.signInWithPopup(provider);

  }
  catch(e){

    console.error(e);

    error.textContent =
      "Terjadi kesalahan: " +
      e.message;

  }

}

/* =========================
   AUTH
========================= */

auth.onAuthStateChanged(async user => {

  document.getElementById("loading")
    .style.display = "none";

  if(user){

    currentUser = user;

    document.getElementById("loginScreen")
      .style.display = "none";

    document.getElementById("mainScreen")
      .style.display = "block";

    await createUserIfNeeded();

    await loadFeed();

  }
  else{

    document.getElementById("loginScreen")
      .style.display = "flex";

    document.getElementById("mainScreen")
      .style.display = "none";

  }

});

/* =========================
   USER
========================= */

async function createUserIfNeeded(){

  const ref =
    db.collection("users")
      .doc(currentUser.uid);

  const snap =
    await ref.get();

  if(!snap.exists){

    const base =
      currentUser.displayName
        ? currentUser.displayName
            .replace(/\s+/g,"_")
            .toLowerCase()
        : "user";

    const username =
      base + "_" +
      Math.floor(Math.random()*100000);

    await ref.set({

      uid:currentUser.uid,

      username:username,

      displayName:
        currentUser.displayName || "Pengguna",

      email:
        currentUser.email || "",

      photoURL:
        currentUser.photoURL || "",

      followers:0,

      following:0,

      likes:0,

      verified:false,

      canUpload:true,

      canComment:true,

      canLike:true,

      canFollow:true,

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });

  }

  const data =
    (await ref.get()).data();

  currentUsername =
    data.username || "Pengguna";

}

/* =========================
   FEED
========================= */

async function loadFeed(){

  const feed =
    document.getElementById("feed");

  feed.innerHTML = "";

  try{

    const snap =
      await db.collection("videos")
        .orderBy("createdAt","desc")
        .limit(50)
        .get();

    if(snap.empty){

      feed.innerHTML = `
        <div class="empty">
          Belum ada video.<br>
          Upload video pertama kamu!
        </div>
      `;

      return;

    }

    snap.forEach(doc => {

      const data = doc.data();

      const card =
        document.createElement("div");

      card.className =
        "videoCard";

      const verified =
        data.verified
          ? `<span class="verified">✓</span>`
          : "";

      const likes =
        data.likes || 0;

      card.innerHTML = `

        <video
          class="video"
          src="${escapeHtml(data.videoUrl || "")}"
          loop
          playsinline
          muted
          preload="metadata"
          onclick="toggleVideo(this)"
        ></video>

        <div class="videoInfo">

          <div class="username">
            @${escapeHtml(data.username || "user")}
            ${verified}
          </div>

          <div class="caption">
            ${escapeHtml(data.caption || "")}
          </div>

        </div>

        <div class="sideActions">

          <button
            class="action"
            onclick="likeVideo('${doc.id}')"
          >
            ❤️
          </button>

          <div class="actionCount">
            ${likes}
          </div>

          <button
            class="action"
            onclick="openComments('${doc.id}')"
          >
            💬
          </button>

          <div class="actionCount">
            ${data.commentsCount || 0}
          </div>

          <button
            class="action"
            onclick="shareVideo('${doc.id}')"
          >
            ↗️
          </button>

        </div>
      `;

      feed.appendChild(card);

    });

    setupAutoPlay();

  }
  catch(e){

    console.error(e);

    feed.innerHTML = `
      <div class="empty">
        Gagal memuat video.<br><br>
        ${escapeHtml(e.message)}
      </div>
    `;

  }

}

/* =========================
   VIDEO
========================= */

function toggleVideo(video){

  if(video.paused){

    video.play().catch(()=>{});

  }
  else{

    video.pause();

  }

}

function setupAutoPlay(){

  const videos =
    document.querySelectorAll(".video");

  const observer =
    new IntersectionObserver(entries => {

      entries.forEach(entry => {

        const video =
          entry.target;

        if(entry.isIntersecting){

          videos.forEach(v => {

            if(v !== video)
              v.pause();

          });

          video.play().catch(()=>{});

        }
        else{

          video.pause();

        }

      });

    },{
      threshold:.65
    });

  videos.forEach(video =>
    observer.observe(video)
  );

}

/* =========================
   LIKE
========================= */

async function likeVideo(videoId){

  if(!currentUser)
    return;

  try{

    const videoRef =
      db.collection("videos")
        .doc(videoId);

    const likeRef =
      videoRef
        .collection("likes")
        .doc(currentUser.uid);

    const like =
      await likeRef.get();

    if(like.exists){

      await likeRef.delete();

      await videoRef.update({

        likes:
          firebase.firestore.FieldValue.increment(-1)

      });

    }
    else{

      await likeRef.set({

        uid:currentUser.uid,

        createdAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });

      await videoRef.update({

        likes:
          firebase.firestore.FieldValue.increment(1)

      });

    }

    await loadFeed();

  }
  catch(e){

    alert("Gagal memberi like: " + e.message);

  }

}

/* =========================
   COMMENTS
========================= */

async function openComments(videoId){

  currentVideoId =
    videoId;

  document.getElementById("commentBox")
    .style.display = "block";

  await loadComments();

}

function closeComments(){

  document.getElementById("commentBox")
    .style.display = "none";

  currentVideoId = null;

}

async function loadComments(){

  if(!currentVideoId)
    return;

  const box =
    document.getElementById("comments");

  box.innerHTML =
    "<div style='color:#888'>Memuat...</div>";

  try{

    const snap =
      await db.collection("videos")
        .doc(currentVideoId)
        .collection("comments")
        .orderBy("createdAt","asc")
        .limit(100)
        .get();

    box.innerHTML = "";

    if(snap.empty){

      box.innerHTML =
        "<div style='color:#888'>Belum ada komentar.</div>";

      return;

    }

    snap.forEach(doc => {

      const data =
        doc.data();

      const div =
        document.createElement("div");

      div.className =
        "comment";

      div.innerHTML = `

        <div class="commentUser">
          @${escapeHtml(data.username || "user")}
        </div>

        <div class="commentText">
          ${escapeHtml(data.text || "")}
        </div>

      `;

      box.appendChild(div);

    });

  }
  catch(e){

    box.innerHTML =
      "<div style='color:#ff7777'>" +
      escapeHtml(e.message) +
      "</div>";

  }

}

async function sendComment(){

  const input =
    document.getElementById("commentInput");

  const text =
    input.value.trim();

  if(!text)
    return;

  if(!currentUser ||
     !currentVideoId)
    return;

  try{

    await db.collection("videos")
      .doc(currentVideoId)
      .collection("comments")
      .add({

        uid:currentUser.uid,

        username:currentUsername,

        text:text,

        createdAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });

    await db.collection("videos")
      .doc(currentVideoId)
      .update({

        commentsCount:
          firebase.firestore.FieldValue.increment(1)

      });

    input.value = "";

    await loadComments();

  }
  catch(e){

    alert(
      "Gagal mengirim komentar: " +
      e.message
    );

  }

}

/* =========================
   UPLOAD
========================= */

function openUpload(){

  closePanels();

  document.getElementById("uploadPanel")
    .style.display = "block";

}

async function uploadVideo(){

  if(!curr
